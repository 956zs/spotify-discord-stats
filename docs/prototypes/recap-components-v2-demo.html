<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recap Components v2 Prototype</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #202225;
        --panel: #2b2d31;
        --panel-strong: #313338;
        --container: #383a40;
        --container-soft: #34363b;
        --text: #f2f3f5;
        --muted: #b5bac1;
        --quiet: #80848e;
        --line: #4a4d54;
        --green: #1db954;
        --gold: #f0b45b;
        --rose: #e06c75;
        --cyan: #61afef;
        --shadow: 0 18px 54px rgba(0, 0, 0, 0.28);
      }

      body {
        margin: 0;
        color: var(--text);
        background:
          linear-gradient(180deg, rgba(29, 185, 84, 0.10), transparent 260px),
          var(--bg);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(360px, 760px) minmax(320px, 430px);
        gap: 22px;
        min-height: 100vh;
        padding: 28px 28px 92px;
      }

      .stage,
      .inspector {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .channel-bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 54px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        border-radius: 8px 8px 0 0;
        background: rgba(49, 51, 56, 0.96);
        backdrop-filter: blur(10px);
      }

      .channel-title {
        font-size: 15px;
        font-weight: 700;
      }

      .channel-meta {
        color: var(--muted);
        font-size: 13px;
      }

      .messages {
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 22px;
      }

      .message {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 12px;
      }

      .avatar {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 50%;
        color: #111318;
        background: var(--green);
        font-weight: 800;
      }

      .message-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 8px;
      }

      .bot-name {
        font-weight: 700;
      }

      .timestamp {
        color: var(--quiet);
        font-size: 12px;
      }

      .component-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .component-container {
        overflow: hidden;
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        background: var(--container);
      }

      .container-inner {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 16px;
      }

      .separator {
        height: 1px;
        background: var(--line);
      }

      .section {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 14px;
        align-items: start;
      }

      .thumbnail img,
      .media-item img {
        display: block;
        width: 100%;
        object-fit: cover;
        background: #24262a;
      }

      .thumbnail,
      .media-item {
        margin: 0;
      }

      .thumbnail img {
        aspect-ratio: 1;
        border-radius: 8px;
      }

      .media-gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .media-item {
        overflow: hidden;
        border-radius: 8px;
        background: #2f3136;
      }

      .media-item img {
        aspect-ratio: 1;
      }

      .media-caption {
        padding: 7px 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .text-display h1,
      .text-display h2,
      .text-display p {
        margin: 0;
      }

      .text-display h1 {
        font-size: 22px;
        line-height: 1.15;
      }

      .text-display h2 {
        color: var(--text);
        font-size: 16px;
        line-height: 1.25;
      }

      .text-display p,
      .text-display .bullet {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .text-display strong {
        color: var(--text);
        font-weight: 800;
      }

      .text-display code {
        padding: 1px 5px;
        border-radius: 4px;
        color: var(--gold);
        background: #24262a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }

      .spacer {
        height: 4px;
      }

      .inspector {
        position: sticky;
        top: 28px;
        align-self: start;
        max-height: calc(100vh - 120px);
        overflow: hidden;
      }

      .inspector-head {
        padding: 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-strong);
      }

      .inspector-head h2 {
        margin: 0 0 6px;
        font-size: 15px;
      }

      .inspector-head p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .state-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .state-cell {
        padding: 10px;
        border-radius: 8px;
        background: var(--container-soft);
      }

      .state-cell span {
        display: block;
        color: var(--quiet);
        font-size: 11px;
      }

      .state-cell strong {
        display: block;
        margin-top: 4px;
        font-size: 17px;
      }

      pre {
        max-height: calc(100vh - 300px);
        margin: 0;
        padding: 16px;
        overflow: auto;
        color: #d7dae0;
        background: #1b1d21;
        font-size: 12px;
        line-height: 1.45;
      }

      .switcher {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 10;
        display: flex;
        gap: 10px;
        align-items: center;
        transform: translateX(-50%);
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #111318;
        box-shadow: var(--shadow);
      }

      .switcher button {
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 50%;
        color: var(--text);
        background: var(--panel-strong);
        cursor: pointer;
        font-size: 18px;
      }

      .switcher button:hover {
        background: var(--container);
      }

      .switch-label {
        min-width: 220px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 1fr;
          padding: 12px 12px 92px;
        }

        .inspector {
          position: static;
          max-height: none;
        }

        pre {
          max-height: 380px;
        }
      }

      @media (max-width: 560px) {
        .messages {
          padding: 14px;
        }

        .section {
          grid-template-columns: minmax(0, 1fr) 72px;
          gap: 10px;
        }

        .media-gallery {
          grid-template-columns: 1fr;
        }

        .message {
          grid-template-columns: 34px minmax(0, 1fr);
        }

        .avatar {
          width: 34px;
          height: 34px;
          font-size: 13px;
        }

        .switch-label {
          min-width: 148px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="stage">
        <header class="channel-bar">
          <div class="channel-title">Spotify Recap DM</div>
          <div class="channel-meta" id="variantMeta"></div>
        </header>
        <div class="messages" id="messages"></div>
      </section>

      <aside class="inspector">
        <div class="inspector-head">
          <h2>Components v2 payload</h2>
          <p>Prototype state mirrors the Discord payload shape: containers, sections, thumbnails, media galleries, text displays, and separators.</p>
        </div>
        <div class="state-grid" id="stateGrid"></div>
        <pre id="payload"></pre>
      </aside>
    </main>

    <nav class="switcher" aria-label="Prototype variants">
      <button id="prev" type="button" aria-label="Previous variant">‹</button>
      <div class="switch-label" id="switchLabel"></div>
      <button id="next" type="button" aria-label="Next variant">›</button>
    </nav>

    <script>
      const COMPONENTS_V2_FLAG = 32768;
      const keys = ['B'];
      const colors = { green: 0x1db954, gold: 0xf0b45b, rose: 0xe06c75, cyan: 0x61afef };

      const variants = {
        B: denseDashboard()
      };

      function denseDashboard() {
        return {
          name: 'Dense Components',
          messages: [
            message('green', [
              section(
                [
                  text('# Weekly Recap\n**118 plays**  |  **9h 42m**  |  **42 artists**  |  **51 albums**\n\nTop 10 songs carried **34%** of the week.')
                ],
                thumbnail('https://picsum.photos/seed/golden-hour/180', 'Top track cover')
              ),
              separator(),
              text('Last 7 days  `Asia/Taipei`  Compared with previous 7 days: **+28 plays**, **+1h 14m**')
            ]),
            message('gold', [
              text('## Rankings'),
              section(
                [text('**Top song**\nGolden Hour - JVKE\n9 plays')],
                thumbnail('https://picsum.photos/seed/top-song/180', 'Top song art')
              ),
              section(
                [text('**Top artist**\nWave to Earth\n18 plays')],
                thumbnail('https://picsum.photos/seed/top-artist/180', 'Top artist art')
              ),
              section(
                [text('**Top album**\nsummer flows 0.02\n14 plays')],
                thumbnail('https://picsum.photos/seed/top-album/180', 'Top album art')
              )
            ]),
            message('cyan', [
              text('## Album Shelf'),
              gallery([
                galleryItem('https://picsum.photos/seed/album-one/280', 'summer flows 0.02'),
                galleryItem('https://picsum.photos/seed/album-two/280', 'Get Up'),
                galleryItem('https://picsum.photos/seed/album-three/280', 'Being Funny')
              ]),
              separator(),
              text('## Patterns\n- Peak day: **Friday**, 31 plays\n- Peak time: **22:00 - 01:00**\n- Night listening: **46% after 21:00**\n- Longest streak: **6 days**\n- Repeat leader: **Golden Hour**, 9 plays')
            ])
          ]
        };
      }

      function message(accentName, components) {
        return { accentName, components: [container(accentName, components)] };
      }

      function container(accentName, components) {
        return { kind: 'container', accentName, components };
      }

      function text(content) {
        return { kind: 'text', content };
      }

      function section(components, accessory) {
        return { kind: 'section', components, accessory };
      }

      function thumbnail(url, description) {
        return { kind: 'thumbnail', url, description };
      }

      function gallery(items) {
        return { kind: 'media_gallery', items };
      }

      function galleryItem(url, description) {
        return { url, description };
      }

      function separator() {
        return { kind: 'separator' };
      }

      function currentKey() {
        const requested = new URLSearchParams(location.search).get('variant');
        return keys.includes(requested) ? requested : 'B';
      }

      function setVariant(key) {
        const url = new URL(location.href);
        url.searchParams.set('variant', key);
        history.replaceState(null, '', url);
        render();
      }

      function cycle(offset) {
        const index = keys.indexOf(currentKey());
        const nextIndex = (index + offset + keys.length) % keys.length;
        setVariant(keys[nextIndex]);
      }

      function render() {
        const key = currentKey();
        const variant = variants[key];
        document.getElementById('messages').innerHTML = variant.messages.map(renderMessage).join('');
        document.getElementById('variantMeta').textContent = `${key} - ${variant.name}`;
        document.getElementById('switchLabel').textContent = `${key} - ${variant.name}`;
        document.getElementById('stateGrid').innerHTML = renderState(variant);
        document.getElementById('payload').textContent = JSON.stringify(toPayloads(variant), null, 2);
      }

      function renderMessage(messageItem, index) {
        const components = messageItem.components.map(renderComponent).join('');
        return `<article class="message">
          <div class="avatar">S</div>
          <div>
            <div class="message-head">
              <span class="bot-name">Spotify Stats</span>
              <span class="timestamp">part ${index + 1}</span>
            </div>
            <div class="component-stack">${components}</div>
          </div>
        </article>`;
      }

      function renderComponent(component) {
        if (component.kind === 'container') {
          return renderContainer(component);
        }
        if (component.kind === 'section') {
          return renderSection(component);
        }
        if (component.kind === 'text') {
          return `<div class="text-display">${markdown(component.content)}</div>`;
        }
        if (component.kind === 'thumbnail') {
          return renderThumbnail(component);
        }
        if (component.kind === 'media_gallery') {
          return renderGallery(component);
        }
        return '<div class="separator"></div>';
      }

      function renderContainer(component) {
        const style = `--accent: #${colors[component.accentName].toString(16).padStart(6, '0')}`;
        return `<section class="component-container" style="${style}">
          <div class="container-inner">${component.components.map(renderComponent).join('')}</div>
        </section>`;
      }

      function renderSection(component) {
        const accessory = component.accessory ? renderComponent(component.accessory) : '';
        return `<div class="section">
          <div class="section-copy">${component.components.map(renderComponent).join('')}</div>
          ${accessory}
        </div>`;
      }

      function renderThumbnail(component) {
        return `<figure class="thumbnail">
          <img src="${escapeHtml(component.url)}" alt="${escapeHtml(component.description)}">
        </figure>`;
      }

      function renderGallery(component) {
        return `<div class="media-gallery">${component.items.map(renderGalleryItem).join('')}</div>`;
      }

      function renderGalleryItem(item) {
        return `<figure class="media-item">
          <img src="${escapeHtml(item.url)}" alt="${escapeHtml(item.description)}">
          <figcaption class="media-caption">${escapeHtml(item.description)}</figcaption>
        </figure>`;
      }

      function renderState(variant) {
        const payloads = toPayloads(variant);
        const totalComponents = payloads.flatMap((item) => item.components).length;
        return [
          stateCell('DMs', variant.messages.length),
          stateCell('Top-level', totalComponents),
          stateCell('Flag', COMPONENTS_V2_FLAG)
        ].join('');
      }

      function stateCell(label, value) {
        return `<div class="state-cell"><span>${label}</span><strong>${value}</strong></div>`;
      }

      function toPayloads(variant) {
        return variant.messages.map((messageItem) => ({
          flags: COMPONENTS_V2_FLAG,
          components: messageItem.components.map(toApiComponent)
        }));
      }

      function toApiComponent(component) {
        if (component.kind === 'container') {
          return {
            type: 17,
            accent_color: colors[component.accentName],
            components: component.components.map(toApiComponent)
          };
        }
        if (component.kind === 'section') {
          return {
            type: 9,
            components: component.components.map(toApiComponent),
            accessory: toApiComponent(component.accessory)
          };
        }
        if (component.kind === 'text') {
          return { type: 10, content: component.content };
        }
        if (component.kind === 'thumbnail') {
          return {
            type: 11,
            media: { url: component.url },
            description: component.description
          };
        }
        if (component.kind === 'media_gallery') {
          return {
            type: 12,
            items: component.items.map((item) => ({
              media: { url: item.url },
              description: item.description
            }))
          };
        }
        return { type: 14 };
      }

      function markdown(content) {
        return content.split('\n').map(markdownLine).join('');
      }

      function markdownLine(line) {
        if (line.startsWith('# ')) {
          return `<h1>${inline(line.slice(2))}</h1>`;
        }
        if (line.startsWith('## ')) {
          return `<h2>${inline(line.slice(3))}</h2>`;
        }
        if (line.startsWith('- ')) {
          return `<div class="bullet">${inline(line)}</div>`;
        }
        if (line.trim() === '') {
          return '<div class="spacer"></div>';
        }
        return `<p>${inline(line)}</p>`;
      }

      function inline(value) {
        return escapeHtml(value)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`(.+?)`/g, '<code>$1</code>');
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      document.getElementById('prev').addEventListener('click', () => cycle(-1));
      document.getElementById('next').addEventListener('click', () => cycle(1));
      window.addEventListener('keydown', (event) => {
        if (isTextInput(document.activeElement)) {
          return;
        }
        if (event.key === 'ArrowLeft') cycle(-1);
        if (event.key === 'ArrowRight') cycle(1);
      });

      function isTextInput(element) {
        return ['INPUT', 'TEXTAREA'].includes(element?.tagName) || element?.isContentEditable;
      }

      render();
    </script>
  </body>
</html>
